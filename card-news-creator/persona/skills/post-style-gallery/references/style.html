<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Style 3 · Gallery</title>
<!-- Style 3 · Gallery · 1080x1350 · replace the words, keep the cropped circle and the split between serif and plate -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@400;500;600&display=block');
:root {
  --paper: #F6F0E6;
  --box: #FBF7F1;
  --ink: #1A1612;
  --muted: #6A5C50;
  --accent: #7A2E2A;
  --night: #1A1612;
  --line: rgba(26,22,18,.18);
  --display: 'Cormorant Garamond', Georgia, serif;
  --font: 'Outfit', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1350px; overflow:hidden; background:var(--paper); }
.card {
  position:relative; width:1080px; height:1350px; overflow:hidden;
  background:var(--paper); color:var(--ink); font-family:var(--font);
}
.orb {
  position:absolute; left:500px; top:250px; width:780px; height:780px; border-radius:50%;
  background:var(--accent);
}
.orb-kicker {
  position:absolute; left:620px; top:430px; width:360px;
  font:500 16px/1 var(--font); letter-spacing:.2em; text-transform:uppercase; color:var(--box);
}
.on-orb {
  position:absolute; left:600px; top:500px; width:420px;
  font:500 italic 148px/0.84 var(--display); color:var(--box); letter-spacing:-.04em;
}
.kicker {
  position:absolute; left:76px; top:92px;
  font:500 18px/1 var(--font); letter-spacing:.2em; text-transform:uppercase; color:var(--accent);
}
h1 {
  position:absolute; left:72px; top:180px; width:470px;
  font:600 116px/0.88 var(--display); letter-spacing:-.035em;
}
.plate {
  position:absolute; left:76px; top:980px; width:390px;
  padding-top:24px; border-top:1px solid var(--ink);
}
.plate b {
  display:block; margin-bottom:16px;
  font:500 16px/1 var(--font); letter-spacing:.18em; text-transform:uppercase; color:var(--accent);
}
.plate p { font:500 30px/1.3 var(--font); }
.foot {
  position:absolute; left:76px; right:72px; bottom:52px;
  display:flex; justify-content:space-between;
  font:500 16px/1 var(--font); letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
}
.source {
  position:absolute; left:76px; width:390px; bottom:128px;
  font:400 18px/1.35 var(--font); color:var(--muted); word-break:break-all;
}
</style>
</head>
<body>
<div class="card">
  <div class="orb"></div>
  <p class="kicker">Field note · 03</p>
  <h1>Hold<br>the idea</h1>
  <p class="orb-kicker">The word that stays</p>
  <p class="on-orb">still</p>
  <aside class="plate"><b>For the reader</b><p>One calm line before the carousel begins</p></aside>
  <footer class="foot"><span>Transcodes</span><span>Gallery</span></footer>
</div>
</body>
</html>

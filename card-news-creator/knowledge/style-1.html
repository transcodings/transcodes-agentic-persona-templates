<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Style 1 · Index</title>
<!-- Style 1 · Index · 1080x1350 · replace the words, keep the rail, rules, and bottom index -->
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Instrument+Sans:wght@500;600;700&display=block');
:root {
  --paper: #F4F0E6;
  --box: #FBFAF6;
  --ink: #161616;
  --muted: #5E594F;
  --accent: #C5362B;
  --night: #161616;
  --line: rgba(22,22,22,.22);
  --font: 'Instrument Sans', sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1350px; overflow:hidden; background:var(--paper); }
.card {
  position:relative; width:1080px; height:1350px; overflow:hidden;
  background:var(--paper); color:var(--ink); font-family:var(--font);
}
.rail {
  position:absolute; inset:0 auto 0 0; width:72px; background:var(--ink); color:var(--paper);
  display:flex; align-items:center; justify-content:center;
}
.rail span {
  writing-mode:vertical-rl; transform:rotate(180deg);
  font:600 18px/1 var(--mono); letter-spacing:.34em; text-transform:uppercase;
}
.top {
  position:absolute; left:120px; right:72px; top:78px;
  display:flex; justify-content:space-between; align-items:baseline;
  font:600 20px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase;
}
.top .count { color:var(--accent); }
.rule { position:absolute; left:120px; right:72px; top:128px; height:2px; background:var(--ink); }
.kicker {
  position:absolute; left:120px; top:164px;
  font:500 18px/1 var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--muted);
}
h1 {
  position:absolute; left:116px; top:250px; width:860px;
  font:700 124px/0.9 var(--font); letter-spacing:-.06em;
}
h1 em { font-style:normal; color:var(--accent); }
.bar { position:absolute; left:120px; top:690px; width:168px; height:16px; background:var(--accent); }
.standfirst {
  position:absolute; left:120px; top:748px; width:680px;
  font:500 36px/1.35 var(--font); color:var(--muted);
}
.index {
  position:absolute; left:120px; right:72px; top:960px;
  display:grid; grid-template-columns:1fr 1fr 1fr;
  border-top:2px solid var(--ink); padding-top:28px;
}
.index b {
  display:block; margin-bottom:16px;
  font:600 16px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--accent);
}
.index span { display:block; font:650 32px/1.15 var(--font); }
.foot {
  position:absolute; left:120px; right:72px; bottom:58px;
  display:flex; justify-content:space-between; align-items:baseline;
  border-top:1px solid var(--line); padding-top:22px;
  font:500 16px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase;
}
.source {
  position:absolute; left:120px; right:72px; bottom:150px;
  font:500 18px/1.4 var(--mono); color:var(--muted); word-break:break-all;
}
</style>
</head>
<body>
<div class="card">
  <aside class="rail"><span>Transcodes</span></aside>
  <header class="top"><span>Card news</span><span class="count">01</span></header>
  <div class="rule"></div>
  <p class="kicker">Cover · One idea</p>
  <h1>A quieter<br>way to<br><em>explain</em></h1>
  <div class="bar"></div>
  <p class="standfirst">One sentence the reader can finish before the next swipe</p>
  <div class="index">
    <div><b>Format</b><span>4:5 card</span></div>
    <div><b>Length</b><span>Six slides</span></div>
    <div><b>Next</b><span>Swipe</span></div>
  </div>
  <footer class="foot"><span>Transcodes</span><span>Team memory for AI</span></footer>
</div>
</body>
</html>
